# Dev uses local DB and can auto-update schema
spring.datasource.url=jdbc:mysql://localhost:3306/tpsdb_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=tpsuser
spring.datasource.password=Project!234

spring.jpa.hibernate.ddl-auto=auto
spring.jpa.show-sql=true

# Smaller pool for local work
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Dev logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.port=9098
